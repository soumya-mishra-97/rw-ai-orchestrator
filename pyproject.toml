[project]
name = "robert-walters-ai-orchestrator"
version = "0.1.0"
description = "Multi-agent SDLC loop (PM -> BA -> Architect -> Dev -> QA) with an independent evaluator agent, retry ladder and human escalation."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
    "rich>=13.9",
    "langchain-core>=1.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]

[project.scripts]
sdlc = "sdlc_loop.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "mypy>=1.13",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "types-reportlab>=5.0.0.20260911",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_loop"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["evals/reports", "evals/labels"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF", "S", "ARG", "PTH", "N", "C4", "PL"]
ignore = [
    "S101",    # assert is used for internal invariants
    "PLR0913", # agent/node factories take explicit keyword dependencies
    "PLR2004", # rubric thresholds read better inline in tests
    "RUF001", "RUF002", "RUF003",  # arrows (→) in docstrings are intentional
    "PLC0415", # lazy imports keep optional deps (uvicorn, presidio) optional
    "ARG002",  # overridable hook methods keep the full signature
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ARG", "PLR", "N802"]
"evals/**" = ["S311", "PLR0912", "PLR0915", "PLR0917", "E501"]
"evals/fault_cases.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["sdlc_loop", "evals"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_anonymizer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:sdlc_loop.*"]

[tool.coverage.run]
source = ["sdlc_loop"]
omit = ["src/sdlc_loop/llm/anthropic_client.py", "src/sdlc_loop/llm/batch_client.py", "src/sdlc_loop/cli.py"]
